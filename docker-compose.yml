services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:
      POSTGRES_USER:
      POSTGRES_PASSWORD:
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      additional_contexts:
        api_src: ./apps/api
        shared_pkg: ./packages/shared
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    volumes:
      - data:/data
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      JOB_DATA_DIR: /data/jobs
    command: sh -lc "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      additional_contexts:
        worker_src: ./apps/worker
        shared_pkg: ./packages/shared
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_started
      sd_webui:
        condition: service_healthy
    volumes:
      - data:/data
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      JOB_DATA_DIR: /data/jobs
      SD_WEBUI_URL: http://sd_webui:7860
    command: celery -A worker_app worker -l info -Q celery --concurrency=1
  sd_webui:
    image: siutin/stable-diffusion-webui-docker:latest-cpu
    ports:
      - "7860:7860"
    volumes:
      - ./data/sd/models:/app/stable-diffusion-webui/models
      - ./data/sd/outputs:/app/stable-diffusion-webui/outputs
      - sd_webui_venv:/app/stable-diffusion-webui/venv
      - sd_webui_cache:/home/app/.cache
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:7860/sdapi/v1/options', timeout=2)); assert d.get('sd_model_checkpoint'), 'no checkpoint yet'"
        ]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 400s
    command: >
      bash webui.sh
      --skip-torch-cuda-test
      --use-cpu all
      --precision full
      --no-half
      --api
      --listen
      --port 7860

volumes:
  pgdata:
  data:
  sd_models:
  sd_webui_venv:
  sd_webui_cache: