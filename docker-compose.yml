services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:
      POSTGRES_USER:
      POSTGRES_PASSWORD:
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  translation_service:
    build:
      context: .
      dockerfile: apps/translation_service/Dockerfile
      additional_contexts:
        translation_src: ./apps/translation_service
    env_file:
      - .env
    ports:
      - "8010:8000"
    volumes:
      - translation_model_cache:/root/.cache
    environment:
      TRANSLATION_MODEL_NAME: Helsinki-NLP/opus-mt-ru-en
      TRANSLATION_TARGET_LANG: en
      TRANSLATION_MAX_TEXT_LENGTH: 1000
      TRANSLATION_DEVICE: cpu
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)); assert d.get('status') == 'ok'"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  text_generation_service:
    build:
      context: .
      dockerfile: apps/text_generation_service/Dockerfile
      additional_contexts:
        text_generation_src: ./apps/text_generation_service
    env_file:
      - .env
    ports:
      - "8020:8000"
    volumes:
      - text_generation_model_cache:/root/.cache
    environment:
      TEXT_GENERATION_MODEL_NAME: Qwen/Qwen2.5-0.5B-Instruct
      TEXT_GENERATION_DEVICE: cpu
      TEXT_GENERATION_MAX_NEW_TOKENS: 256
      TEXT_GENERATION_TEMPERATURE: 0.7
      TEXT_GENERATION_TOP_P: 0.9
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)); assert d.get('status') == 'ok'"
        ]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 180s
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  sound_generation_service:
    build:
      context: .
      dockerfile: apps/sound_generation_service/Dockerfile
      additional_contexts:
        sound_generation_src: ./apps/sound_generation_service
    env_file:
      - .env
    ports:
      - "8030:8000"
    volumes:
      - sound_generation_model_cache:/root/.cache
    environment:
      SOUND_GENERATION_MODEL_NAME: facebook/musicgen-small
      SOUND_GENERATION_DEVICE: cpu
      SOUND_GENERATION_DEFAULT_DURATION_SECONDS: 5
      SOUND_GENERATION_MAX_DURATION_SECONDS: 160
      SOUND_GENERATION_TOP_K: 250
      SOUND_GENERATION_TOP_P: 0.0
      SOUND_GENERATION_TEMPERATURE: 1.0
      SOUND_GENERATION_CFG_COEF: 3.0
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)); assert d.get('status') == 'ok'"
        ]
      interval: 10s
      timeout: 5s
      retries: 90
      start_period: 300s
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      additional_contexts:
        api_src: ./apps/api
        shared_pkg: ./packages/shared
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      translation_service:
        condition: service_healthy
    volumes:
      - data:/data
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      JOB_DATA_DIR: /data/jobs
      TRANSLATION_SERVICE_URL: http://translation_service:8000
      TRANSLATION_TIMEOUT_SECONDS: 5
    command: sh -lc "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      additional_contexts:
        worker_src: ./apps/worker
        shared_pkg: ./packages/shared
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_started
      sd_webui:
        condition: service_healthy
      text_generation_service:
        condition: service_healthy
      sound_generation_service:
        condition: service_healthy
    volumes:
      - data:/data
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      JOB_DATA_DIR: /data/jobs
      SD_WEBUI_URL: http://sd_webui:7860
      TEXT_GENERATION_SERVICE_URL: http://text_generation_service:8000
      TEXT_GENERATION_TIMEOUT_SECONDS: 120
      SOUND_GENERATION_SERVICE_URL: http://sound_generation_service:8000
      AUDIO_GENERATION_TIMEOUT_SECONDS: 1800
    command: celery -A worker_app worker -l info -Q celery --concurrency=1

  sd_webui:
    image: siutin/stable-diffusion-webui-docker:latest-cpu
    ports:
      - "7860:7860"
    volumes:
      - ./data/sd/models:/app/stable-diffusion-webui/models
      - ./data/sd/outputs:/app/stable-diffusion-webui/outputs
      - sd_webui_venv:/app/stable-diffusion-webui/venv
      - sd_webui_cache:/home/app/.cache
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:7860/sdapi/v1/options', timeout=2)); assert d.get('sd_model_checkpoint'), 'no checkpoint yet'"
        ]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 400s
    command: >
      bash webui.sh
      --skip-torch-cuda-test
      --use-cpu all
      --precision full
      --no-half
      --api
      --listen
      --port 7860

  web:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
  data:
  sd_webui_venv:
  sd_webui_cache:
  translation_model_cache:
  text_generation_model_cache:
  sound_generation_model_cache:
