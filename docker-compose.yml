services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:
      POSTGRES_USER:
      POSTGRES_PASSWORD:
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      additional_contexts:
        api_src: ./apps/api
        shared_pkg: ./packages/shared
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    volumes:
      - data:/data
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      JOB_DATA_DIR: /data/jobs
    command: sh -lc "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      additional_contexts:
        worker_src: ./apps/worker
        shared_pkg: ./packages/shared
    env_file:
      - .env
    depends_on:
      - redis
      - postgres
    volumes:
      - data:/data
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      JOB_DATA_DIR: /data/jobs
    command: celery -A worker_app worker -l info -Q celery --concurrency=1

volumes:
  pgdata:
  data: